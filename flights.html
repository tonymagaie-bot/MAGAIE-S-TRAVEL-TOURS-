<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Flight Itinerary</title>
<link rel="stylesheet" href="style.css">

<style>
html, body {
  height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: 
    linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url('voo.jpg') no-repeat center center / cover;
  color: white;
}

section {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

/* GLOBAL TEXT STYLE */
body {
  color: white;
  font-family: "Playfair Display", serif;
}

/* TITLE */
h1 {
  font-size: 3rem;
  color: #D4AF37;
  margin-bottom: 15px;
  letter-spacing: 1px;
}

/* PARAGRAPH */
p {
  font-size: 1.3rem;
  max-width: 700px;
  line-height: 1.6;
  color: #f5f5f5;
}

/* NAV */
nav a, nav span {
  color: #D4AF37;
  font-weight: bold;
  font-size: 1rem;
}
</style>

</head>

<body>

<nav>
  <a href="index.html" data-en="← Home" data-pt="← Início">← Início</a>

  <span class="lang-btn" onclick="setLang('pt')">PT</span> |
  <span class="lang-btn" onclick="setLang('en')">EN</span>
</nav>

<section>
  <h1 data-en="Flight Itinerary" data-pt="Roteiro de Voo">
    Roteiro de Voo
  </h1>

  <p data-en="We help you plan the best flight routes, connections, and prices for your journey."
     data-pt="Ajudamos a planear as melhores rotas, conexões e preços de voo para a sua viagem.">
     Ajudamos a planear as melhores rotas, conexões e preços de voo para a sua viagem.
  </p>
</section>

<script>
function setLang(lang){
  localStorage.setItem("lang", lang);
  applyLang(lang);
}

function applyLang(lang){
  document.querySelectorAll("[data-en]").forEach(el=>{
    el.textContent = el.getAttribute("data-" + lang);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang") || "pt";
  applyLang(savedLang);
});
</script>

</body>
</html>
