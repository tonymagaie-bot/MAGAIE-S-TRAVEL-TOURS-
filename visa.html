<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Visa Services</title>

<style>

/* RESET */
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
}

/* VIDEO BACKGROUND */
.bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* DARK OVERLAY (for readability) */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 0;
}
/* GLOBAL TEXT STYLE */
body {
  color: white;
  font-family: "Playfair Display", serif; /* luxury feel */
}

/* TITLE */
h1 {
  font-size: 3rem;          /* bigger */
  color: #D4AF37;           /* gold */
  margin-bottom: 15px;
  letter-spacing: 1px;
}

/* PARAGRAPH */
p {
  font-size: 1.3rem;        /* bigger text */
  max-width: 700px;
  line-height: 1.6;
  color: #f5f5f5;           /* soft white */
}

/* NAV */
nav a, nav span {
  color: #D4AF37;           /* gold */
  font-weight: bold;
  font-size: 1rem;
}
nav a, .lang-btn {
  color: white;
  margin-right: 10px;
  cursor: pointer;
  text-decoration: none;
}

/* CENTER CONTENT */
section {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  padding: 20px;
}

/* BUTTON */
.btn {
  margin-top: 20px;
  padding: 12px 24px;
  background: #25D366;
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
}

</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<video class="bg-video" autoplay muted loop playsinline preload="auto">
  <source src="video.mp4" type="video/mp4">
</video>

<nav>
  <a href="index.html" data-en="← Home" data-pt="← Início">← Início</a>

  <span class="lang-btn" onclick="setLang('pt')">PT</span> |
  <span class="lang-btn" onclick="setLang('en')">EN</span>
</nav>

<section>
  <h1 data-en="Visa Application" data-pt="Pedido de Visto">
    Pedido de Visto
  </h1>

  <p data-en="We assist with visa processing, documentation, and more."
     data-pt="Ajudamos no processo de visto, documentação e muito mais.">
     Ajudamos no processo de visto, documentação e muito mais.
  </p>

  <a class="btn" 
     href="https://wa.me/258879843287"
     data-en="Apply via WhatsApp"
     data-pt="Solicitar via WhatsApp">
     Solicitar via WhatsApp
  </a>
</section>

<script>
function setLang(lang){
  localStorage.setItem("lang", lang);
  applyLang(lang);
}

function applyLang(lang){
  document.querySelectorAll("[data-en]").forEach(el=>{
    el.innerText = el.getAttribute("data-" + lang);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang") || "pt";
  applyLang(savedLang);
});
</script>

</body>
</html>
