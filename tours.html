<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>African Tours</title>
<link rel="stylesheet" href="style.css">

<style>
/* FULL BACKGROUND WITH YOUR PHOTO */
html, body {
  height: 100%;
}
body {
  margin: 0;
  min-height: 100vh;
  background: 
    linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url('myphoto.png') no-repeat 60% center / 100%;
  color: black;
}
/* CENTER CONTENT */
section {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
</style>

</head>

<body>

<nav>
  <a href="index.html" data-en="← Home" data-pt="← Início">← Início</a>

  <!-- LANGUAGE -->
  <span class="lang-btn" onclick="setLang('pt')">PT</span> |
  <span class="lang-btn" onclick="setLang('en')">EN</span>
</nav>

<section>
  <h1 data-en="African Tours" data-pt="Tours em África">
    Tours em África
  </h1>

  <p data-en="Explore curated travel experiences across Africa."
     data-pt="Explore experiências de viagem selecionadas em África.">
     Explore experiências de viagem selecionadas em África.
  </p>
</section>

<script>
function setLang(lang){
  localStorage.setItem("lang", lang);
  applyLang(lang);
}

function applyLang(lang){
  document.querySelectorAll("[data-en]").forEach(el=>{
    el.innerText = el.getAttribute("data-" + lang);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang") || "pt";
  applyLang(savedLang);
});
</script>

</body>
</html>
